[package]
name = "mirailedger_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
anyhow = "1"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.6"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "11.1"
zxcvbn = "3.1"
sqlx = {
  version = "0.9",
  features = ["runtime-tokio", "mysql", "time", "chrono"]
}
tokio = { version = "1.54", features = ["rt-multi-thread"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
