[package]
name = "mirailedger_backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
axum = "0.8"
anyhow = "1"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.6", features = ["getrandom"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "12.0"
zxcvbn = "3.1"
sqlx = {
  version = "0.9",
  features = [
    "runtime-tokio",
    "tls-native-tls",
    "mysql",
    "migrate",
    "macros",
    "uuid",
    "chrono"
  ]
}
tokio = { version = "1.54", features = ["rt-multi-thread"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
